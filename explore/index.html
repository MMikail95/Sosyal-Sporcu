<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAGER++ | Keşfet</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#adff2f">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../team-fix.css">
    <link rel="stylesheet" href="../faz2-7.css">
    <link rel="stylesheet" href="../fixes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <!-- Oturum Koruma -->
    <script>
    (async function guardSession() {
        if (!window.sbClient) return;
        try {
            const { data: { session } } = await window.sbClient.auth.getSession();
            if (!session) { window.location.replace('../auth.html'); return; }
            window.__AUTH_USER__ = session.user;
            window.sbClient.auth.onAuthStateChange((ev, _s) => {
                if (_s && _s.user) window.__AUTH_USER__ = _s.user;
            });
        } catch(e) { console.warn('Session check failed:', e.message); }
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-container">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <button class="sidebar-toggle" id="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Menüyü Aç/Kapat">
        <i class="fa-solid fa-bars" id="sidebar-toggle-icon"></i>
    </button>

    <!-- Sidebar: components.js inject eder -->
    <div id="sidebar-placeholder"></div>

    <!-- Bildirim (Fixed) -->
    <div class="notif-wrapper" id="notif-wrapper">
        <button class="notif-bell" id="notif-bell-btn" onclick="toggleNotifPanel()">
            <i class="fa-solid fa-bell"></i>
            <span class="notif-count" id="notif-count" style="display:none;">0</span>
        </button>
        <div class="notif-panel" id="notif-panel">
            <div class="notif-panel-header">
                <i class="fa-solid fa-bell"></i> Bildirimler
                <button onclick="markAllRead()" class="notif-clear-btn">Tümünü Oku</button>
            </div>
            <div class="notif-list" id="notif-list">
                <div class="notif-empty"><i class="fa-regular fa-bell-slash"></i><br>Yeni bildirim yok</div>
            </div>
        </div>
    </div>

    <main class="main-content">
        <section id="explore" class="section active">
            <div style="margin-bottom:1.5rem;">
                <h1 class="section-title" style="font-size:1.8rem; margin-bottom:0.2rem;">
                    <i class="fa-solid fa-compass" style="color:var(--neon-cyan);"></i> Keşfet
                </h1>
                <p style="color:#555; font-size:0.9rem;">Oyuncuları ve takımları keşfet</p>
            </div>

            <!-- Explore Tab Bar -->
            <div class="explore-tab-bar">
                <button class="explore-tab-btn active" id="etab-btn-players" onclick="switchExploreTab('players')">
                    <i class="fa-solid fa-users"></i> Oyuncular
                </button>
                <button class="explore-tab-btn" id="etab-btn-teams" onclick="switchExploreTab('teams')">
                    <i class="fa-solid fa-shield-halved"></i> Takımlar
                </button>
            </div>

            <!-- TAB: Oyuncular -->
            <div id="etab-players" class="explore-tab-content" style="display:block;">
                <div class="explore-filters" style="display:flex; gap:0.75rem; margin-bottom:1.25rem; flex-wrap:wrap;">
                    <input type="text" id="explore-search" class="profile-input"
                           placeholder="İsim veya şehir ara..." style="flex:1; min-width:160px;"
                           oninput="filterExplore()">
                    <select id="explore-pos-filter" class="profile-select" style="width:160px;" onchange="filterExplore()">
                        <option value="">Tüm Mevkiler</option>
                        <option value="KL">🧤 Kaleci</option>
                        <option value="DEF">🛡️ Defans</option>
                        <option value="OS">⚡ Orta Saha</option>
                        <option value="FV">⚽ Forvet</option>
                    </select>
                </div>
                <div class="explore-player-grid" id="explore-player-grid">
                    <div style="text-align:center; padding:3rem; color:#444;">
                        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    </div>
                </div>
            </div>

            <!-- TAB: Takımlar -->
            <div id="etab-teams" class="explore-tab-content" style="display:none;">
                <div style="display:flex; gap:0.75rem; margin-bottom:0.75rem; flex-wrap:wrap;">
                    <input type="text" id="explore-team-search" class="profile-input"
                           placeholder="Takım adı ara..." style="flex:1; min-width:140px;"
                           oninput="filterExploreTeams()"
                           onkeydown="if(event.key==='Enter') filterExploreTeams()">
                    <select id="explore-district-filter" class="profile-input"
                            style="flex:0 0 auto; min-width:130px;"
                            onchange="filterExploreTeams()">
                        <option value="">Tüm Bölgeler</option>
                        <option value="Kadıköy">Kadıköy</option>
                        <option value="Üsküdar">Üsküdar</option>
                        <option value="Beşiktaş">Beşiktaş</option>
                        <option value="Şişli">Şişli</option>
                        <option value="Ataşehir">Ataşehir</option>
                        <option value="Maltepe">Maltepe</option>
                        <option value="Bakırköy">Bakırköy</option>
                        <option value="Fatih">Fatih</option>
                    </select>
                    <button class="btn-outline" onclick="filterExploreTeams()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <div id="explore-team-grid">
                    <div style="text-align:center; padding:3rem; color:#444;">
                        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    </div>
                </div>
            </div>

        </section>
    </main>
</div>

<!-- JS -->
<script src="../db.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../script.js"></script>
<script src="../faz1.js"></script>
<script src="../faz2-social.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
        if (typeof window.initExplore === 'function') window.initExplore();
        if (typeof initRealNotifications === 'function') initRealNotifications();
    }, 300);
});
</script>
</body>
</html>
