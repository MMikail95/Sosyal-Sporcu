<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sosyal Sporcu | Maç Merkezi</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#adff2f">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../team-fix.css">
    <link rel="stylesheet" href="../faz2-7.css">
    <link rel="stylesheet" href="../fixes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <!-- Oturum Koruma -->
    <script>
    (async function guardSession() {
        if (!window.sbClient) return;
        try {
            const { data: { session } } = await window.sbClient.auth.getSession();
            if (!session) { window.location.replace('../auth.html'); return; }
            window.__AUTH_USER__ = session.user;
            window.sbClient.auth.onAuthStateChange((ev, _s) => {
                if (_s && _s.user) window.__AUTH_USER__ = _s.user;
            });
        } catch(e) { console.warn('Session check failed:', e.message); }
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-container">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <button class="sidebar-toggle" id="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Menüyü Aç/Kapat">
        <i class="fa-solid fa-bars" id="sidebar-toggle-icon"></i>
    </button>

    <!-- Sidebar: components.js inject eder -->
    <div id="sidebar-placeholder"></div>

    <!-- Bildirim (Fixed) -->
    <div class="notif-wrapper" id="notif-wrapper">
        <button class="notif-bell" id="notif-bell-btn" onclick="toggleNotifPanel()">
            <i class="fa-solid fa-bell"></i>
            <span class="notif-count" id="notif-count" style="display:none;">0</span>
        </button>
        <div class="notif-panel" id="notif-panel">
            <div class="notif-panel-header">
                <i class="fa-solid fa-bell"></i> Bildirimler
                <button onclick="markAllRead()" class="notif-clear-btn">Tümünü Oku</button>
            </div>
            <div class="notif-list" id="notif-list">
                <div class="notif-empty"><i class="fa-regular fa-bell-slash"></i><br>Yeni bildirim yok</div>
            </div>
        </div>
    </div>

    <main class="main-content">
        <section id="matches" class="section active">
            <div class="section-header">
                <h1 class="section-title"><i class="fa-solid fa-clipboard-list" style="color:var(--neon-cyan);"></i> Maç Merkezi</h1>
                <p class="section-subtitle">Maçlarını yönet, oluştur ve katıl</p>
            </div>
            <!-- Sekme çubuğu -->
            <div class="glass-card mc-tabs-bar">
                <button class="mc-tab-btn active" onclick="mcSwitchTab('my-matches', this)">
                    <i class="fa-solid fa-calendar-check"></i> Maçlarım
                </button>
                <button class="mc-tab-btn" onclick="mcSwitchTab('proposals', this)">
                    <i class="fa-solid fa-clipboard-list"></i> Planlanan
                </button>
                <button class="mc-tab-btn" onclick="mcSwitchTab('open-matches', this)">
                    <i class="fa-solid fa-door-open"></i> Açık Maçlar
                </button>
                <button class="mc-tab-btn" onclick="mcSwitchTab('create-match', this)">
                    <i class="fa-solid fa-plus"></i> Maç Planla
                </button>
            </div>
            <!-- Sekme: Maçlarım -->
            <div id="mc-tab-my-matches" class="mc-tab-content">
                <div id="mc-matches-list"><div class="empty-state-sm"><i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor…</div></div>
            </div>
            <!-- Sekme: Planlanan Maçlar -->
            <div id="mc-tab-proposals" class="mc-tab-content" style="display:none;">
                <div id="mc-proposals-list"><div class="empty-state-sm"><i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor…</div></div>
            </div>
            <!-- Sekme: Açık Maçlar -->
            <div id="mc-tab-open-matches" class="mc-tab-content" style="display:none;">
                <div id="mc-open-list"><div class="empty-state-sm"><i class="fa-solid fa-spinner fa-spin"></i> Yükleniyor…</div></div>
            </div>
            <!-- Sekme: Maç Planla -->
            <div id="mc-tab-create-match" class="mc-tab-content" style="display:none;">
                <div class="glass-card mc-create-form">
                    <h3 class="mc-form-title"><i class="fa-solid fa-clipboard-list"></i> Maç Planla</h3>
                    <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem;">Kadro oylaması açılır, yeterli oyuncu toplanınca rakibe davet gönderilir.</p>
                    <div class="mc-form-grid">
                        <div class="form-group">
                            <label class="form-label">Halı Saha</label>
                            <input type="text" class="form-input" id="mc-venue-input" placeholder="Saha adını yazın (ör. Beşiktaş Halı Saha)" maxlength="60">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tarih</label>
                            <input type="date" class="form-input" id="mc-date-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Saat</label>
                            <select class="form-select" id="mc-time-input"></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Kaç kişilik maç?</label>
                            <select class="form-select" id="mc-type-select" onchange="mcUpdateRequiredPlayers(this.value)">
                                <option value="5v5">5v5 — 5 kişi</option>
                                <option value="7v7">7v7 — 7 kişi</option>
                                <option value="8v8" selected>8v8 — 8 kişi</option>
                                <option value="11v11">11v11 — 11 kişi</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Takımın (Ev Sahibi)</label>
                            <select class="form-select" id="mc-home-team-select">
                                <option value="">— Takım seçin —</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Rakip Takım <span style="color:var(--text-muted);font-size:0.8rem;">(opsiyonel, sonra eklenebilir)</span></label>
                            <div class="mc-away-search-wrap">
                                <input type="text" class="form-input" id="mc-away-team-input"
                                    placeholder="Takım ara…" autocomplete="off"
                                    oninput="mcSearchAwayTeam(this.value)">
                                <div class="mc-away-results" id="mc-away-results" style="display:none;"></div>
                            </div>
                            <div id="mc-away-selected" class="mc-away-selected" style="display:none;"></div>
                        </div>
                        <div class="form-group mc-form-full">
                            <label class="form-label">Notlar (opsiyonel)</label>
                            <textarea class="form-input" id="mc-notes-input" rows="2" placeholder="Kurallar, buluşma noktası, vb."></textarea>
                        </div>
                    </div>
                    <button class="btn-primary mc-submit-btn" id="mc-submit-btn" onclick="mcSubmitCreate()">
                        <i class="fa-solid fa-users"></i> Kadro Oylaması Başlat
                    </button>
                </div>
            </div>

            <!-- Kadro Seçim Modal (Proposal Poll) -->
            <div id="mc-poll-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center;">
                <div class="glass-card" style="width:min(480px,94vw);max-height:80vh;overflow-y:auto;padding:1.5rem;position:relative;">
                    <button onclick="document.getElementById('mc-poll-modal-backdrop').style.display='none'" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
                    <h3 style="margin-bottom:0.25rem;"><i class="fa-solid fa-users" style="color:var(--neon-green);"></i> Kadro Oylaması</h3>
                    <p id="mc-poll-modal-desc" style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem;"></p>
                    <div id="mc-poll-member-list" style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1rem;"></div>
                    <button class="btn-primary" style="width:100%;" onclick="mcSendProposalPoll()">
                        <i class="fa-solid fa-paper-plane"></i> Oylama Gönder
                    </button>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- JS -->
<script src="../db.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../script.js"></script>
<script src="../faz1.js"></script>
<script src="../takimim.js"></script>
<script src="../faz2-7.js"></script>
<script src="../faz2-social.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
        if (typeof initRealNotifications === 'function') initRealNotifications();
        if (typeof initMatchCenter === 'function') initMatchCenter();
        // Tarih input'unu bugün+1 saat olarak ayarla
        if (typeof window._mcInitDateInput === 'function') window._mcInitDateInput();
    }, 600);
});
</script>
</body>
</html>
